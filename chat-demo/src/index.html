<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>DeepChat</title>
  </head>
  <body>
    <div id="root"></div>
    <template id="startup-help">
      <main role="alert" style="box-sizing:border-box;min-height:100vh;padding:24px;background:#fff;color:#222;font:16px/1.6 Roboto,sans-serif">
        <h1 style="font-size:20px">DeepChat 加载失败</h1>
        <p>请点「重新加载」。如果仍然打不开，请在系统应用商店检查 WebView 更新，或在设置里检查系统更新。</p>
        <p data-version></p>
        <button type="button" style="min-height:44px;padding:0 18px;font:inherit">重新加载</button>
      </main>
    </template>
    <script>
      (function () {
        function showLoadError() {
          var root = document.getElementById('root')
          if (!root || root.firstElementChild) return
          root.appendChild(document.getElementById('startup-help').content.cloneNode(true))
          var engine = /(?:Chrome|Chromium)\/(\d+)/.exec(navigator.userAgent)
          var version = document.querySelector('meta[name="application-version"]')
          root.querySelector('[data-version]').textContent = [version && 'DeepChat ' + version.content, engine && 'Chromium ' + engine[1]].filter(Boolean).join(' · ')
          root.querySelector('button').onclick = function () { location.reload() }
        }
        window.addEventListener('error', showLoadError, true)
        window.addEventListener('unhandledrejection', showLoadError)
        window.setTimeout(showLoadError, 8000)
      })()
    </script>
  </body>
</html>
